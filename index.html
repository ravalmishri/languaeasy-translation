
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LinguaEasy is a simple online language translation tool.">
  <title>LinguaEasy Translation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f5ff;
      color: #20243a;
    }

    header {
      padding: 28px 20px;
      text-align: center;
      background: #5146d8;
      color: white;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      line-height: 1.5;
    }

    main {
      width: min(900px, 92%);
      margin: 32px auto;
    }

    .translator {
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(30, 35, 80, 0.09);
    }

    .languages {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: end;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d8dbea;
      border-radius: 10px;
      font: inherit;
      background: white;
      color: #20243a;
    }

    select {
      min-height: 46px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    textarea:focus,
    select:focus {
      outline: 2px solid #8d86ff;
      border-color: #5146d8;
    }

    .text-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .text-panel {
      min-width: 0;
    }

    .counter {
      margin-top: 7px;
      text-align: right;
      font-size: 12px;
      color: #666b80;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 9px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .primary {
      background: #5146d8;
      color: white;
    }

    .primary:hover:not(:disabled) {
      background: #4035bf;
    }

    .secondary {
      background: #eeedff;
      color: #4035bf;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .swap {
      min-width: 46px;
      min-height: 46px;
      background: #eeedff;
      color: #4035bf;
    }

    #status {
      min-height: 24px;
      margin-top: 16px;
      line-height: 1.5;
      color: #5146d8;
      overflow-wrap: anywhere;
    }

    footer {
      padding: 0 12px 28px;
      text-align: center;
      color: #666b80;
      font-size: 13px;
      line-height: 1.7;
    }

    footer a {
      color: #5146d8;
    }

    @media (max-width: 650px) {
      header h1 {
        font-size: 27px;
      }

      .translator {
        padding: 17px;
      }

      .languages {
        grid-template-columns: 1fr auto 1fr;
        gap: 7px;
      }

      .text-grid {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 140px;
      }

      .actions button {
        flex: 1 1 auto;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>LinguaEasy Translation</h1>
    <p>Break language barriers. Connect with the world.</p>
  </header>

  <main>
    <section class="translator" aria-label="Translation tool">
      <div class="languages">
        <div>
          <label for="source">Translate from</label>
          <select id="source">
            <option value="en" selected>English</option>
            <option value="gu">Gujarati</option>
            <option value="hi">Hindi</option>
            <option value="mr">Marathi</option>
            <option value="bn">Bengali</option>
            <option value="ta">Tamil</option>
            <option value="te">Telugu</option>
            <option value="pa">Punjabi</option>
            <option value="ur">Urdu</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="ru">Russian</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="zh">Chinese</option>
            <option value="ar">Arabic</option>
          </select>
        </div>

        <button class="swap" id="swap" type="button"
          aria-label="Swap languages" title="Swap languages">⇄</button>

        <div>
          <label for="target">Translate to</label>
          <select id="target">
            <option value="gu" selected>Gujarati</option>
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="mr">Marathi</option>
            <option value="bn">Bengali</option>
            <option value="ta">Tamil</option>
            <option value="te">Telugu</option>
            <option value="pa">Punjabi</option>
            <option value="ur">Urdu</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="ru">Russian</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="zh">Chinese</option>
            <option value="ar">Arabic</option>
          </select>
        </div>
      </div>

      <div class="text-grid">
        <div class="text-panel">
          <label for="input">Your text</label>
          <textarea id="input" maxlength="5000"
            placeholder="Type or paste your text here..."></textarea>
          <div class="counter" id="count">0 / 5000 characters</div>
        </div>

        <div class="text-panel">
          <label for="output">Translation result</label>
          <textarea id="output" readonly
            placeholder="Your translation will appear here..."></textarea>
          <div class="counter">Translation appears here</div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="translate" type="button">
          Translate text
        </button>
        <button class="secondary" id="copy" type="button">
          Copy translation
        </button>
        <button class="secondary" id="clear" type="button">
          Clear
        </button>
      </div>

      <div id="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    LinguaEasy — an educational language translation project.<br>
    Translation powered by
    <a href="https://mymemory.translated.net/"
      target="_blank" rel="noopener noreferrer">MyMemory</a>.
    Results may not always be accurate. Avoid entering private information.
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);

    const source = $("source");
    const target = $("target");
    const input = $("input");
    const output = $("output");
    const status = $("status");
    const translateButton = $("translate");

    input.addEventListener("input", () => {
      $("count").textContent =
        input.value.length + " / 5000 characters";
      status.textContent = "";
    });

    $("clear").addEventListener("click", () => {
      input.value = "";
      output.value = "";
      $("count").textContent = "0 / 5000 characters";
      status.textContent = "";
      input.focus();
    });

    $("swap").addEventListener("click", () => {
      const previousSource = source.value;

      source.value = target.value;
      target.value = previousSource;

      const previousInput = input.value;
      input.value = output.value;
      output.value = previousInput;

      $("count").textContent =
        input.value.length + " / 5000 characters";
      status.textContent = "Languages swapped.";
    });

    $("copy").addEventListener("click", async () => {
      if (!output.value) {
        status.textContent = "Translate some text first.";
        return;
      }

      try {
        await navigator.clipboard.writeText(output.value);
        status.textContent = "Translation copied!";
      } catch (error) {
        output.focus();
        output.select();
        status.textContent =
          "Press Command + C to copy the selected translation.";
      }
    });

    translateButton.addEventListener("click", async () => {
      const text = input.value.trim();

      if (!text) {
        status.textContent = "Please enter text to translate.";
        input.focus();
        return;
      }

      if (source.value === target.value) {
        output.value = text;
        status.textContent =
          "Source and target languages are the same.";
        return;
      }

      translateButton.disabled = true;
      translateButton.textContent = "Translating...";
      output.value = "";
      status.textContent = "Translating. Please wait...";

      try {
        const params = new URLSearchParams({
          q: text,
          langpair: source.value + "|" + target.value
        });

        const response = await fetch(
          "https://api.mymemory.translated.net/get?" +
          params.toString()
        );

        if (!response.ok) {
          throw new Error("The translation service is unavailable.");
        }

        const data = await response.json();

        if (
          Number(data.responseStatus) !== 200 ||
          !data.responseData ||
          !data.responseData.translatedText
        ) {
          throw new Error(
            data.responseDetails || "No translation was returned."
          );
        }

        output.value = data.responseData.translatedText
          .replace(/&#39;/g, "'")
          .replace(/&quot;/g, '"')
          .replace(/&amp;/g, "&")
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">");

        status.textContent = "Translation complete!";
      } catch (error) {
        console.error("Translation error:", error);
        status.textContent =
          "Translation failed. Check your internet connection or try again later.";
      } finally {
        translateButton.disabled = false;
        translateButton.textContent = "Translate text";
      }
    });
  </script>
</body>
</html>
