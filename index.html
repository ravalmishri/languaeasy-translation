
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinguaEasy - Language Translator</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 28px 16px;
  font-family: Arial, sans-serif;
  background: #f1f4ff; color: #202440;
}
main { max-width: 850px; margin: auto; }
header { text-align: center; margin-bottom: 25px; }
header .logo { font-size: 42px; }
h1 { margin: 8px 0; font-size: 36px; }
header p { color: #626982; }
.card {
  background: white; padding: 24px;
  border-radius: 18px; box-shadow: 0 8px 30px #20244012;
}
.languages {
  display: grid; grid-template-columns: 1fr auto 1fr;
  gap: 12px; align-items: end; margin-bottom: 18px;
}
label { display: block; font-weight: bold; margin-bottom: 8px; }
select, textarea {
  width: 100%; padding: 12px; border: 1px solid #d6daea;
  border-radius: 10px; font: inherit; background: white;
}
textarea { min-height: 180px; resize: vertical; line-height: 1.5; }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
button {
  border: 0; border-radius: 10px; padding: 12px 16px;
  font-size: 15px; cursor: pointer;
}
.primary { background: #5148dc; color: white; font-weight: bold; }
.secondary { background: #eef0ff; color: #302b87; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
#status { min-height: 24px; margin-top: 14px; color: #555e76; }
footer { text-align: center; color: #626982; font-size: 13px; line-height: 1.6; margin-top: 20px; }
@media(max-width:600px) {
  .panels { grid-template-columns: 1fr; }
  .languages { gap: 6px; }
  .card { padding: 16px; }
}
</style>
</head>
<body>
<main>
<header>
  <div class="logo">🌐</div>
  <h1>LinguaEasy</h1>
  <p>Break language barriers. Connect with the world.</p>
</header>

<section class="card">
  <div class="languages">
    <div>
      <label for="source">Translate from</label>
      <select id="source">
        <option value="en">English</option>
        <option value="gu">Gujarati</option>
        <option value="hi">Hindi</option>
        <option value="mr">Marathi</option>
        <option value="bn">Bengali</option>
        <option value="pa">Punjabi</option>
        <option value="ta">Tamil</option>
        <option value="te">Telugu</option>
        <option value="ur">Urdu</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="ja">Japanese</option>
        <option value="ar">Arabic</option>
        <option value="zh-CN">Chinese</option>
      </select>
    </div>
    <button class="secondary" id="swap" title="Swap languages">⇄</button>
    <div>
      <label for="target">Translate to</label>
      <select id="target">
        <option value="gu">Gujarati</option>
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="mr">Marathi</option>
        <option value="bn">Bengali</option>
        <option value="pa">Punjabi</option>
        <option value="ta">Tamil</option>
        <option value="te">Telugu</option>
        <option value="ur">Urdu</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="ja">Japanese</option>
        <option value="ar">Arabic</option>
        <option value="zh-CN">Chinese</option>
      </select>
    </div>
  </div>

  <div class="panels">
    <div>
      <label for="input">Your text</label>
      <textarea id="input" maxlength="450"
        placeholder="Type your text here..."></textarea>
      <small id="count">0 characters</small>
    </div>
    <div>
      <label for="output">Translation</label>
     
<textarea id="output" placeholder="Your translation will appear here..."></textarea>

    </div>
  </div>

  <div class="actions">
    <button class="primary" id="translate">Translate text</button>
    <button class="secondary" id="copy">Copy translation</button>
    <button class="secondary" id="clear">Clear</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
</section>

<footer>
  LinguaEasy — an educational language translation project.<br>
  Translation requires an internet connection and uses the
  <a href="https://mymemory.translated.net/" target="_blank"
     rel="noopener noreferrer">MyMemory translation service</a>.
  Results may not always be accurate. Avoid entering private information.
</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const source = $("source");
const target = $("target");
const input = $("input");
const output = $("output");
const status = $("status");

input.addEventListener("input", () => {
  $("count").textContent = input.value.length + " characters";
});

$("swap").addEventListener("click", () => {
  const oldLanguage = source.value;
  source.value = target.value;
  target.value = oldLanguage;

  const oldText = input.value;
  input.value = output.value;
  output.value = oldText;

  $("count").textContent = input.value.length + " characters";
  status.textContent = "";
});

$("clear").addEventListener("click", () => {
  input.value = "";
  output.value = "";
  $("count").textContent = "0 characters";
  status.textContent = "";
});

$("copy").addEventListener("click", async () => {
  if (!output.value) {
    status.textContent = "Translate some text first.";
    return;
  }
  try {
    await navigator.clipboard.writeText(output.value);
    status.textContent = "Translation copied!";
  } catch {
    output.select();
    status.textContent = "Select and copy the translation manually.";
  }
});


$("translate").addEventListener("click", async () => {
  const text = input.value.trim();

  if (!text) {
    status.textContent = "Please enter text to translate.";
    return;
  }

  if (source.value === target.value) {
    output.value = text;
    status.textContent = "Source and target languages are the same.";
    return;
  }

  const button = $("translate");
  button.disabled = true;
  button.textContent = "Translating...";
  output.value = "";
  status.textContent = "Translating...";

  try {
    const response = await fetch(
      "https://translate.argosopentech.com/translate",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          q: text,
          source: source.value,
          target: target.value,
          format: "text"
        })
      }
    );

    if (!response.ok) {
      throw new Error("Translation service unavailable");
    }

    const data = await response.json();

    if (!data.translatedText) {
      throw new Error("No translation returned");
    }

    output.value = data.translatedText;
   

    status.textContent =
    
  
      "https://translate.argosopentech.com/translate",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          q: text,
          source: source.value,
          target: target.value,
          format: "text"
        })
      }
    );

    if (!response.ok) {
      throw new Error("Translation service unavailable");
    }

    const data = await response.json();

    if (!data.translatedText) {
      throw new Error("No translation returned");
  

    output.value = data.translatedText;
    status.textContent = "Translation complete!";

  } catch (error) {
    status.textContent = "Translation failed. Please try again or check your internet connection.";
  } finally {
    button.disabled = false;
    button.textContent = "Translate text";
  }
});
</script>
</body>
</html>
